<!--
  The redline shell. It is never filled by hand: assets/render.mjs reads redline.json and
  injects the whole document body at the BODY marker below, then build.mjs inlines the
  libraries. Editing the generated page instead of the data file is how the page and the
  gate stop agreeing.

  What is structure and what is yours:
    STRUCTURE  the grid, the rail, the card anatomy, the three-state theme wiring, the token
               NAMES. chart-kit.js reads tokens by name, so renaming one breaks every chart.
    YOURS      the eight hue values marked below. A report that reuses the sample hues for a
               different subject looks like a template, because it is one.

  The script tags at the bottom hold the placeholders build.mjs substitutes. Each must appear
  exactly once, so never quote one inside a comment — the assembler would fill the comment
  instead of the script tag and the page would silently lose a library.
-->
<title>The redline</title>
<style>
:root{
  /* ---- the eight you choose per report. Validate before using:
         node <skill>/assets/validate-palette.mjs "<hex,hex,...>" --surface "#FFFFFF"
         accent-2 / warm are also the diverging poles, so that pair needs the widest CVD gap ---- */
  --accent:#00707E; --accent-2:#0090A0; --warm:#C2611A; --indigo:#42509E; --olive:#8A7A18;
  --flag:#9E3B10; --flag-bg:#FBF1EA; --good:#0F6F5C;

  /* ---- derived from the eight: sequential ramp ends, diverging poles + neutral middle,
         bivariate corners. Keep the names; re-step the values with the hues. ---- */
  --seq0:#E4EFF1; --seq1:#00646F; --dneg:#C2611A; --dpos:#0090A0; --dmid:#ECEFF1;
  --bv0:#E8EDEF; --bvA:#0090A0; --bvB:#C2611A;

  /* ---- neutrals: pick a bias toward the accent rather than a pure grey ---- */
  --ground:#E9ECEF; --surface:#FFFFFF; --surface-2:#F3F5F7; --surface-3:#FAFBFC;
  --line:#CFD6DD; --line-2:#E4E8EC;
  --ink:#141A20; --ink-2:#4B5661; --ink-3:#7B8792;
  --grid:#E2E7EB; --nodata:#DDE2E7;

  --shadow:0 1px 2px rgba(20,26,32,.06),0 6px 18px rgba(20,26,32,.05);
  --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
/* Dark is stepped separately, not inverted, and validated against its own surface. The two
   blocks are identical on purpose: the media query serves the un-stamped default state, the
   attribute block serves an explicit toggle. Losing either one loses a real audience. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#3FB8C6; --accent-2:#0E9DAE; --warm:#CE6C26; --indigo:#6675C8; --olive:#B7AC3A;
  --flag:#E0764A; --flag-bg:#221812; --good:#3FA98F;
  --seq0:#12303A; --seq1:#54CBD9; --dneg:#CE6C26; --dpos:#0E9DAE; --dmid:#252D34;
  --bv0:#1B232A; --bvA:#0E9DAE; --bvB:#CE6C26;
  --ground:#0E1317; --surface:#161C22; --surface-2:#1C232A; --surface-3:#131920;
  --line:#2B343C; --line-2:#212930;
  --ink:#E4E9EE; --ink-2:#9DA9B4; --ink-3:#6E7A85;
  --grid:#252E36; --nodata:#222A31;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --accent:#3FB8C6; --accent-2:#0E9DAE; --warm:#CE6C26; --indigo:#6675C8; --olive:#B7AC3A;
  --flag:#E0764A; --flag-bg:#221812; --good:#3FA98F;
  --seq0:#12303A; --seq1:#54CBD9; --dneg:#CE6C26; --dpos:#0E9DAE; --dmid:#252D34;
  --bv0:#1B232A; --bvA:#0E9DAE; --bvB:#CE6C26;
  --ground:#0E1317; --surface:#161C22; --surface-2:#1C232A; --surface-3:#131920;
  --line:#2B343C; --line-2:#212930;
  --ink:#E4E9EE; --ink-2:#9DA9B4; --ink-3:#6E7A85;
  --grid:#252E36; --nodata:#222A31;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.011em}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-variant-ligatures:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.wrap{display:grid;grid-template-columns:224px minmax(0,1fr);gap:0;max-width:1240px;margin:0 auto}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:28px 18px 40px 24px;
  border-right:1px solid var(--line);font-family:var(--mono);font-size:11.5px;line-height:1.5}
.rail h5{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:22px 0 8px;font-weight:500}
.rail h5:first-child{margin-top:0}
.rail a{display:flex;gap:8px;padding:3px 0;color:var(--ink-2);text-decoration:none;border-radius:3px}
.rail a:hover,.rail a:focus-visible{color:var(--accent)}
.rail a .k{color:var(--ink-3);min-width:22px}
.main{padding:0 40px 120px;min-width:0}

/* ---------- masthead ---------- */
.mast{padding:64px 0 34px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.mast h1{font-size:clamp(34px,5vw,52px);line-height:1.04;margin:14px 0 0;letter-spacing:-.025em}
.mast .sub{font-size:19px;color:var(--ink-2);margin:16px 0 0;max-width:62ch;line-height:1.55}
.src{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:22px;line-height:1.7}
.src b{color:var(--ink-2);font-weight:500}

/* ---------- generic ---------- */
section{padding-top:52px}
section>h2{font-size:26px;letter-spacing:-.02em;padding-bottom:10px;border-bottom:1px solid var(--line)}
section>h2 .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.08em;
  margin-left:10px;font-weight:400;vertical-align:middle}
p{margin:14px 0;max-width:68ch}
.lede{font-size:17px;color:var(--ink-2)}
strong{font-weight:650;color:var(--ink)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:20px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
thead th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td code{font-size:12px;color:var(--ink)}
.role{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.hi{color:var(--warm);font-weight:600}
.dim{color:var(--ink-3)}

/* ---------- callouts ---------- */
.call{border-left:3px solid var(--accent-2);background:var(--surface);padding:16px 20px;
  margin:24px 0;border-radius:0 6px 6px 0;box-shadow:var(--shadow)}
.call.warn{border-left-color:var(--flag);background:var(--flag-bg)}
.call h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin-bottom:6px}
.call.warn h4{color:var(--flag)}
.call p{margin:6px 0 0;font-size:14.5px}

/* ---------- the seat roster: a grid of small cards, and it goes before the findings ---------- */
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:22px}
.seat{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px 16px;box-shadow:var(--shadow)}
.seat h3{font-size:15px;margin:10px 0 0;letter-spacing:-.012em}
.seat p{font-size:13.5px;color:var(--ink-2);margin:5px 0 0;max-width:none;line-height:1.5}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--surface);background:var(--accent);padding:2px 7px;border-radius:3px;
  display:inline-block;white-space:nowrap}
.chip.q2{color:var(--accent);background:var(--surface-2);border:1px solid var(--line-2)}

/* ---------- the finding card: ten fields read as four groups, never as ten flat rows ---------- */
article.find{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  margin:26px 0;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:20px}
article.find>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:16px 24px;border-bottom:1px solid var(--line-2);background:var(--surface-3)}
article.find>header h3{font-size:19px;letter-spacing:-.015em;flex:1 1 24ch}
.find .body{padding:4px 24px 24px}
/* the group divider is what turns ten fields into four questions */
.grp{padding:18px 0;border-top:1px solid var(--line-2)}
.grp>h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin-bottom:10px}
.f{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:4px 14px;margin:6px 0;font-size:14.5px}
.f>.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding-top:4px}
@media (max-width:620px){.f{grid-template-columns:minmax(0,1fr)}}

/* ---------- who acts: every seat, each with its own reason ---------- */
ul.who{list-style:none;margin:8px 0 0;padding:0}
ul.who>li{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:12px;
  padding:7px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}
ul.who>li:last-child{border-bottom:0}

/* ---------- tasker: imperatives, then the artifact they produce ---------- */
ol.tasker{list-style:none;counter-reset:step;margin:8px 0 0;padding:0}
ol.tasker>li{counter-increment:step;position:relative;padding:5px 0 5px 34px;font-size:14.5px}
ol.tasker>li::before{content:counter(step,decimal-leading-zero);position:absolute;left:0;top:5px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.produces{margin-top:10px;background:var(--surface-2);border-radius:5px;padding:10px 14px;font-size:14px}
.produces b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;display:block;margin-bottom:3px}

/* ---------- the change: the sentence, its home, and the priced comparison ---------- */
.change{margin-top:6px;border-left:3px solid var(--accent-2);background:var(--surface-2);
  padding:16px 20px;border-radius:0 6px 6px 0}
.change .f{grid-template-columns:8.5em minmax(0,1fr)}
.label-line{font-family:var(--mono);font-size:11.5px;color:var(--warm);font-style:italic;
  margin:16px 0 4px;letter-spacing:.01em}
.asym{font-weight:650;color:var(--ink);margin:10px 0 0;font-size:14.5px}

figure{margin:0 0 20px;border:1px solid var(--line-2);border-radius:6px;
  background:var(--surface-3);overflow:hidden}
.chart{padding:14px 12px 6px;overflow-x:auto}
.chart svg{display:block;max-width:100%;height:auto}
figcaption{font-size:12.5px;color:var(--ink-2);padding:9px 16px 12px;border-top:1px solid var(--line-2);
  line-height:1.5;background:var(--surface)}
figcaption b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;display:block;margin-bottom:3px}
.q{font-family:var(--serif);font-size:17.5px;font-style:italic;color:var(--ink);
  margin:0;max-width:58ch;line-height:1.45}
.q::before{content:"\201C"}.q::after{content:"\201D"}
.fail{border-left:3px solid var(--flag);background:var(--flag-bg);
  padding:12px 18px;border-radius:0 5px 5px 0;margin:0 0 12px}
.fail h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--flag);font-weight:500;margin-bottom:5px}

/* ---------- chart furniture: chart-kit.js writes into these ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:2px 4px 10px;
  font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.ramp{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.ramp .bar{height:9px;width:120px;border-radius:2px;border:1px solid var(--line-2)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 12px;font-family:var(--mono);font-size:11px}
.ctrl button{font:inherit;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);
  padding:3px 9px;border-radius:4px;cursor:pointer}
.ctrl button:hover{border-color:var(--accent-2);color:var(--accent)}
.ctrl button[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.ctrl select{font:inherit;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);
  padding:3px 6px;border-radius:4px}
.ctrl .lbl{color:var(--ink-3);align-self:center}
/* playback timestamp: a pill pinned beside the scrubber, sized so it can't be missed;
   tabular figures stop it jittering as frames tick past */
.ctrl .stamp{align-self:center;font-size:13px;font-weight:700;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;color:var(--accent);background:var(--surface);
  border:1px solid var(--accent-2);border-radius:4px;padding:2px 9px;min-width:7ch;text-align:center}
/* the scrubber track fills to --p (set by the transport) so timeline position is
   readable at a glance, not only from the thumb */
.ctrl input[type=range]{-webkit-appearance:none;appearance:none;align-self:center;height:20px;
  margin:0;background:transparent;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent-2) var(--p,100%),var(--line) 0)}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  margin-top:-4px;border-radius:50%;background:var(--accent-2);border:2px solid var(--surface);
  box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ctrl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.ctrl input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent-2)}
.ctrl input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
  background:var(--accent-2);border:2px solid var(--surface)}
#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;z-index:99;
  background:var(--ink);color:var(--ground);font-family:var(--mono);font-size:11.5px;line-height:1.5;
  padding:7px 10px;border-radius:5px;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
/* the pill is inverted (ink bg, ground text), so the title must come from the same
   inverted family — hardcoded #fff disappears on the light pill of the dark theme */
#tip b{color:var(--surface-3);font-weight:600}
svg text{font-family:var(--mono);fill:var(--ink-2)}
.ax line,.ax path{stroke:var(--line)}
.ax text{font-size:10px;fill:var(--ink-3)}
.gl{stroke:var(--grid);stroke-width:1}

button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:960px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 18px;padding:20px 24px}
  .main{padding:0 24px 80px}
}
footer{margin-top:70px;padding-top:26px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3);line-height:1.8}
</style>

<div id="tip"></div>
<div class="wrap">
<!--BODY-->
</div>

<script>window.CD=/*DATA*/;</script>
<script>/*KIT*/</script>
<script>/*CHARTS*/</script>
